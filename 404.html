
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Section Plot Lost</title>
    <!-- Link to your clean standalone style block sheet -->
    <link rel="stylesheet" href="404.css">
</head>
<body>

    <!-- Ambient background soft lighting aura overlay -->
    <div class="err-bg-blur-orb"></div>

    <main class="err-containment-card">
        
        <!-- Illustration Vector Section Area -->
        <div class="err-illustration-box">
            <div class="err-major-code-text">404</div>
            <!-- Professional Sprout Vector Asset Icon -->
            <svg class="err-floating-sprout-vector" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A1.5,1.5 0 0,1 13.5,5.5A1.5,1.5 0 0,1 12,7A1.5,1.5 0 0,1 10.5,5.5A1.5,1.5 0 0,1 12,4M12,18C10.5,18 9,17.2 8,16C9,14.5 10.5,13.5 12,13.5C13.5,13.5 15,14.5 16,16C15,17.2 13.5,18 12,18M12,9A3,3 0 0,1 15,12A3,3 0 0,1 12,15A3,3 0 0,1 9,12A3,3 0 0,1 12,9Z"/>
            </svg>
        </div>

        <h1>Ecosystem Sector Plot Missing</h1>
        <p>The system node data parameters you requested reside outside our active agricultural field coordinate boundaries. The link might be uncalibrated or expired.</p>

        <!-- Twin Button Interaction Action Cluster Array Component -->
        <div class="err-action-buttons-row">
            
            <!-- Button Link 1: Programmatic Section Return Hook -->
            <button class="btn-err-action type-back" id="err-trigger-go-back" aria-label="Return back directly to your previous active dashboard view section">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M20,11V13H8L13.5,18.5L12.08,19.92L4.16,12L12.08,4.08L13.5,5.5L8,11H20Z"/>
                </svg>
                <span>Go Back</span>
            </button>

            <!-- Button Link 2: Central Base Anchor Redirection Route -->
            <a href="index.html" class="btn-err-action type-home" aria-label="Navigate securely back to the website home index page view">
                <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                    <path d="M10,20V14H14V20H19V12H22L12,3L2,12H5V20H10Z"/>
                </svg>
                <span>Return Home</span>
            </a>

        </div>

    </main>

   <style>
    /* --- CORE STACKLY LIGHT AGRICULTURE THEME VARIABLES --- */
:root {
    --bg-bright: #f1f8e9;      /* Natural soft foliage background wash layer pass */
    --text-dark: #1b5e20;      /* Premium deep forest green primary text color string */
    --agri-glow: #4caf50;      /* Active grass green theme accent token */
    --white: #ffffff;
    --dark-slate: #1c2321;     /* High contrast dark neutral base text shade */
}

body {
    background-color: var(--bg-bright);
    color: var(--dark-slate);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 1.5rem;
    overflow: hidden;
    position: relative;
}

/* Ambient background soft mesh blur light burst */
.err-bg-blur-orb {
    position: absolute;
    width: 450px;
    height: 450px;
    background: radial-gradient(circle, rgba(76, 175, 80, 0.12) 0%, transparent 65%);
    z-index: 1;
    pointer-events: none;
}

/* Principal Card Isolation Shell Geometry Frame */
.err-containment-card {
    position: relative;
    background-color: var(--white);
    max-width: 560px;
    width: 100%;
    padding: 4rem 3rem;
    border-radius: 24px;
    border: 1px solid rgba(27, 94, 32, 0.05);
    box-shadow: 0 20px 50px rgba(27, 94, 32, 0.04);
    text-align: center;
    z-index: 2;
    animation: errCardEntrance 0.5s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
}

/* Graphic Vector Illustration Area */
.err-illustration-box {
    margin-bottom: 2rem;
    position: relative;
    display: inline-flex;
    justify-content: center;
    align-items: center;
}

.err-major-code-text {
    font-size: 7.5rem;
    font-weight: 900;
    color: var(--text-dark);
    line-height: 1;
    letter-spacing: -4px;
    opacity: 0.15;
    user-select: none;
}

.err-floating-sprout-vector {
    position: absolute;
    width: 64px;
    height: 64px;
    fill: var(--agri-glow);
    filter: drop-shadow(0 4px 12px rgba(76, 175, 80, 0.25));
    animation: errSproutFloat 4s ease-in-out infinite alternate;
}

/* Typography Header Labels */
.err-containment-card h1 {
    font-size: 2rem;
    font-weight: 800;
    color: var(--dark-slate);
    margin-bottom: 0.75rem;
    letter-spacing: -0.5px;
    line-height: 1.2;
}

.err-containment-card p {
    font-size: 1rem;
    color: #555555;
    line-height: 1.6;
    margin-bottom: 2.5rem;
    max-width: 440px;
    margin-left: auto;
    margin-right: auto;
    font-weight: 500;
}

/* --- THE TWO BUTTON ACTION STRIP INTERFACE COMPONENT --- */
.err-action-buttons-row {
    display: grid;
    grid-template-columns: 1fr 1fr; /* Balanced split column layout track */
    gap: 1.25rem;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
}

.btn-err-action {
    text-decoration: none;
    cursor: pointer;
    border: none;
    padding: 1.1rem 1.5rem;
    border-radius: 30px; /* Reference-matched rounded capsule curvature */
    font-size: 0.95rem;
    font-weight: 800;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.6rem;
    transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
    box-sizing: border-box;
}

/* Style Core Path 1: Programmatic Back Redirect Trigger Key */
.btn-err-action.type-back {
    background-color: var(--bg-bright);
    color: var(--text-dark);
    border: 1px solid rgba(27, 94, 32, 0.05);
}

.btn-err-action.type-back svg {
    fill: var(--text-dark);
    transition: transform 0.25s ease;
}

.btn-err-action.type-back:hover {
    background-color: var(--text-dark);
    color: var(--white);
    border-color: var(--text-dark);
}

.btn-err-action.type-back:hover svg {
    fill: var(--white);
    transform: translateX(-4px); /* Trajectory directional shift back */
}

/* Style Core Path 2: Central Home Landing Link */
.btn-err-action.type-home {
    background-color: var(--agri-glow);
    color: var(--white);
    box-shadow: 0 6px 15px rgba(76, 175, 80, 0.2);
}

.btn-err-action.type-home svg {
    fill: var(--white);
    transition: transform 0.25s ease;
}

.btn-err-action.type-home:hover {
    background-color: var(--text-dark);
    box-shadow: 0 8px 25px rgba(27, 94, 32, 0.25);
}

.btn-err-action.type-home:hover svg {
    transform: scale(1.15); /* Pulse expansion feedback loop */
}

/* --- ACCELERATED TRANSITIONS MOTION KEYFRAMES --- */
@keyframes errCardEntrance {
    0% { opacity: 0; transform: scale(0.96) translateY(12px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

@keyframes errSproutFloat {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(-10px) rotate(4deg); }
}

/* --- RESPONSIVE MEDIA BLOCK BREAKPOINTS --- */
@media (max-width: 580px) {
    .err-containment-card {
        padding: 3rem 1.5rem;
        border-radius: 16px;
    }
    .err-major-code-text { font-size: 6rem; letter-spacing: -2px; }
    .err-floating-sprout-vector { width: 54px; height: 54px; }
    .err-containment-card h1 { font-size: 1.6rem; }
    
    /* Collapse buttons layout to a single column vertical stack on small screens */
    .err-action-buttons-row {
        grid-template-columns: 1fr;
        gap: 0.85rem;
    }
    .btn-err-action { width: 100%; }
}

   </style>

   <script>
    document.addEventListener("DOMContentLoaded", () => {
    
    // Locate the standalone back trigger activation element node
    const goBackTriggerNode = document.getElementById("err-trigger-go-back");

    if (goBackTriggerNode) {
        goBackTriggerNode.addEventListener("click", () => {
            
            // Defensively evaluate previous referrers to keep dashboard view tab memory active
            if (document.referrer && document.referrer !== "") {
                window.location.href = document.referrer;
            } else {
                // Secondary hardware historical fallbacks lookup
                window.history.back();
            }
        });
    }
});

   </script>
</body>
</html>
